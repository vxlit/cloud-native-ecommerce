apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
      - name: product-service
        image: product-service:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8000

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:shreyas@postgres-service:5432/ecommerce